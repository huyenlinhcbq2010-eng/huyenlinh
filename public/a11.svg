<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e3a8a"/>
      <stop offset="50%" stop-color="#ea580c"/>
      <stop offset="100%" stop-color="#f59e0b"/>
    </linearGradient>
    <linearGradient id="glow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <rect width="400" height="400" rx="60" fill="url(#bg)"/>
  <rect width="400" height="200" rx="60" fill="url(#glow)"/>
  
  <!-- Teacher Silhouette / Badge -->
  <circle cx="200" cy="150" r="75" fill="#fef3c7" stroke="#ffffff" stroke-width="6"/>
  <!-- Hair style -->
  <path d="M130 150 C130 80, 270 80, 270 150 C270 210, 255 230, 250 240 C240 210, 220 180, 200 180 C180 180, 160 210, 150 240 C145 230, 130 210, 130 150 Z" fill="#451a03"/>
  <circle cx="200" cy="155" r="55" fill="#fed7aa"/>
  <!-- Friendly Face -->
  <circle cx="180" cy="150" r="6" fill="#1e293b"/>
  <circle cx="220" cy="150" r="6" fill="#1e293b"/>
  <path d="M185 175 Q200 190 215 175" fill="none" stroke="#ea580c" stroke-width="4" stroke-linecap="round"/>
  
  <!-- Blazer / Jacket -->
  <path d="M110 350 C110 260, 150 240, 200 240 C250 240, 290 260, 290 350 Z" fill="#fde68a"/>
  <!-- Inner shirt -->
  <polygon points="180,240 220,240 200,290" fill="#1d4ed8"/>
  
  <!-- Name Ribbon -->
  <rect x="30" y="325" width="340" height="55" rx="18" fill="#ffffff" stroke="#ea580c" stroke-width="4"/>
  <text x="200" y="360" font-family="system-ui, sans-serif" font-size="20" font-weight="900" fill="#1e293b" text-anchor="middle">
    GV: TRƯƠNG THỊ HUYỀN LINH
  </text>
</svg>
